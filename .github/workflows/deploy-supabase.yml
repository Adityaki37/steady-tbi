name: Deploy shared Supabase backend

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply migrations and deploy demo-signup (false previews migrations only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: steady-demo-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: steady-demo
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration baseline
        run: python3 scripts/check_backend.py
      - name: Test database policies
        run: |
          npm ci --prefix test-tools --ignore-scripts
          node test-tools/backend.test.mjs
      - name: Preview or apply to Steady Demo
        run: |
          if [ "$APPLY" = true ]; then
            sh scripts/deploy-backend.sh apply
          else
            sh scripts/deploy-backend.sh plan
          fi
      - name: Verify hosted API
        run: |
          python3 - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path
          config = plistlib.loads(Path('Steady/SteadyResources/Backend.demo.plist').read_bytes())
          subprocess.run(['node', 'test-tools/hosted-health.mjs'], env={**os.environ, **config}, check=True)
          PY

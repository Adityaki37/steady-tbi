name: Live local Supabase e2e

on:
  push:
    branches: [feat/push-notifications-and-clinician-upload]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local Supabase stack
        run: |
          npx --yes supabase@2.84.2 start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,postgres-meta
      - name: Export stack credentials (masked, never printed)
        run: |
          npx --yes supabase@2.84.2 status -o json > "$RUNNER_TEMP/status.json"
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/status.json", "utf8"));
            const pick = (...names) => names.map((n) => s[n]).find(Boolean);
            const values = {
              SUPABASE_URL: pick("API_URL"),
              SUPABASE_ANON_KEY: pick("ANON_KEY"),
              SUPABASE_SERVICE_ROLE_KEY: pick("SERVICE_ROLE_KEY")
            };
            for (const [name, value] of Object.entries(values)) {
              if (!value) { console.error("Missing " + name + " in supabase status"); process.exit(1); }
              if (name !== "SUPABASE_URL") console.log("::add-mask::" + value);
              fs.appendFileSync(process.env.GITHUB_ENV, name + "=" + value + "\n");
            }
          '
          rm -f "$RUNNER_TEMP/status.json"
      - name: Run live e2e
        run: node test-tools/live-stack.e2e.mjs
      - name: Supabase container logs (tail, on failure)
        if: failure()
        run: |
          for c in $(docker ps -a --filter "name=supabase_" --format '{{.Names}}'); do
            echo "=== $c ==="
            docker logs --tail 40 "$c" 2>&1 | sed -E 's/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/[jwt]/g' || true
          done
      - name: Stop stack
        if: always()
        run: npx --yes supabase@2.84.2 stop --no-backup
